# ================================================
# TerritoryCore - Configuración Principal
# ================================================

# Prefixes para mensajes del plugin
prefixes:
  main: "&8[&6⚔ &e&lChronicle&6&lTerritory &6⚔&8]"
  admin: "&8[&4⚡ &c&lADMIN &4⚡&8]"
  success: "&8[&a✔&8]"
  error: "&8[&c✖&8]"
  info: "&8[&b&lℹ&8]"

# Configuración de reclamación de territorios
claiming:
  radius_per_player: 10
  max_radius: 250

# Configuración de territorios
territories:
  # Radio de cada territorio en bloques
  radius: 250

  # Protección de bloques
  protection:
    enabled: true
    allow_owner_build: true
    allow_owner_break: true
    allow_member_build: false
    allow_member_break: false
    allow_non_member_build: false
    allow_non_member_break: false

# Mensajes personalizados
messages:
  # Errores
  no_permission: "&cNo tienes permisos"
  territory_not_found: "&cTerritorio no encontrado"
  already_claimed: "&cEste territorio ya está reclamado"
  not_owner: "&cNo eres el dueño de este territorio"
  too_far: "&cEl territorio está demasiado lejos"

  # Éxito
  territory_claimed: "&a✓ ¡Territorio reclamado exitosamente!"
  territory_unclaimed: "&a✓ ¡Territorio liberado!"
  territory_created: "&a✓ Territorio creado exitosamente"
  territory_deleted: "&a✓ Territorio eliminado"

  # Información
  territory_info: "&eTerritorio: {name}"
  territory_owner: "&eDueño: {owner}"
  territory_size: "&eTamaño: {size}"
  territory_level: "&eNivel: {level}"

