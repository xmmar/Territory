# Configuración de partículas
particles:
  # Habilitar/deshabilitar partículas
  enabled: true

  # Frecuencia de las partículas (en ticks)
  frequency: 2

  # Rango de las partículas
  range: 3

  # Cantidad de partículas
  amount: 1

# Configuración de efectos de poción
effects:
  # Habilitar/deshabilitar efectos
  enabled: true

  # Duración de los efectos (en ticks, -1 = infinito mientras estés en el territorio)
  duration: -1

  # Amplitud de los efectos (0 = nivel I, 1 = nivel II, etc.)
  amplifier: 0

# Configuración de mobs escalados
mobs:
  # Habilitar/deshabilitar escalado de mobs
  enabled: true

  # Mostrar nivel del mob en el nombre
  show_level: true

  # Formato del nivel en el nombre
  level_format: "&e[Lvl {level}]"

# Configuración de estadísticas de territorios
statistics:
  # Nivel de cada territorio
  levels:
    monte_olimpo: 10
    esparta: 25
    bosque_artemisa: 20
    atenas_antigua: 15
    acantilados_poseidon: 18
    santuario_apolo: 16
    ruinas_delfos: 22
    valle_ares: 28
    coloso_rodas: 50
    islas_egeas: 30
    piramide_keops: 35
    valle_reyes: 40
    oasis_bastet: 12
    desierto_set: 35
    templo_anubis: 38
    rio_nilo: 18
    biblioteca_thoth: 20
    necropolis: 55
    templo_solar_ra: 25
    laberinto_sobek: 45
    ruinas_imperio: 60
    arena_titanes: 50
    puerta_inframundo: 55
    ciudad_perdida: 52
    trono_dominador: 100

# Configuración de upkeep (mantenimiento)
upkeep:
  # Habilitar/deshabilitar upkeep
  enabled: false

  # Cantidad base de dinero por día
  base_amount: 1000

  # Multiplicador según el nivel del territorio
  level_multiplier: 100

# Configuración de eventos
events:
  # Evento de entrada a territorio
  entry_event:
    enabled: true
    show_title: true
    show_action_bar: true
    play_sound: true
    spawn_particles: true

  # Evento de salida del territorio
  exit_event:
    enabled: true
    remove_effects: true

# Configuración de integración con otros plugins
integrations:
  # AuraSkills
  aura_skills:
    enabled: true
    apply_effects: true

  # BlockParticles
  block_particles:
    enabled: true
    particle_density: 1

  # BiomeEffects
  biome_effects:
    enabled: true

  # LevelledMobs
  levelled_mobs:
    enabled: true
    scale_mobs: true

  # zMenu
  zmenu:
    enabled: true
    menu_name_territorios: "territorios"
    menu_name_grecia: "grecia"
    menu_name_egipto: "egipto"
    menu_name_central: "central"

# Configuración de base de datos
database:
  # Tipo de base de datos (sqlite, mysql, etc.)
  type: "sqlite"

  # Configuración de SQLite
  sqlite:
    file: "territories.db"

  # Configuración de MySQL (si lo usas)
  mysql:
    host: "localhost"
    port: 3306
    database: "territories"
    username: "root"
    password: "password"
    use_ssl: false

# Configuración de spawns y zonas seguras
spawns:
  # Radio de la zona segura alrededor del spawn (en bloques)
  safe_zone_radius: 50

  # Prevenir spawn de mobs hostiles en zona segura
  prevent_hostile_spawns: true

  # Cargar schematic automáticamente
  load_schematics: true

# Configuración de mobs temáticos por territorio
territory_mobs:
  enabled: true

  # Mobs específicos por territorio (se spawnean naturalmente)
  custom_spawns:
    # Territorios Griegos
    monte_olimpo:
      - "PHANTOM:5:§b✦ Espíritu del Olimpo"
      - "BLAZE:3:§6⚡ Guardián Divino"

    esparta:
      - "ZOMBIE:10:§4⚔ Guerrero Espartano"
      - "SKELETON:8:§7🏹 Arquero de Esparta"
      - "IRON_GOLEM:2:§f⚔ Campeón Espartano"

    bosque_artemisa:
      - "WOLF:5:§2🐺 Lobo de Artemisa"
      - "SPIDER:7:§8🕷 Araña del Bosque"

    # Territorios Egipcios
    piramide_keops:
      - "HUSK:10:§6⚰ Momia Guardiana"
      - "WITHER_SKELETON:3:§8☠ Faraón Maldito"

    desierto_set:
      - "HUSK:15:§c☠ Soldado de Set"
      - "RAVAGER:1:§4🐗 Bestia del Desierto"

    # Territorios Centrales
    ruinas_imperio:
      - "ZOMBIE:12:§4👑 Legionario Imperial"
      - "SKELETON:12:§7🏹 Arquero Imperial"
      - "VINDICATOR:5:§c⚔ Guardia Imperial"

# Debug
debug:
  enabled: false
  log_territory_checks: false
  log_particle_spawning: false
  log_effect_application: false
  log_mob_spawns: false