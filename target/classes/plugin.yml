name: TerritoryCore
version: 1.0.0
main: com.invictus.territory.TerritoryCore
description: Sistema de territorios para el servidor
authors:
  - xmmarMe
api-version: "1.20"

commands:
  territorios:
    description: "Comando principal de territorios"
    usage: "/territorios <subcomando>"
    aliases:
      - terr
      - t
  tadmin:
    description: "Comando de administración de territorios"
    usage: "/tadmin <subcomando>"
    aliases:
      - ta
    permission: "territorio.admin"
    permission-message: "No tienes permisos"

permissions:
  territorio.admin:
    description: "Permiso para administrar territorios"
    default: op